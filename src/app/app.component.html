<div class="app-viewport">

  <!-- AUTHENTICATED STATE: Messenger & Heart Particles background -->
  <ng-container *ngIf="isLoggedIn">
    <!-- Beautiful romantic background hearts emitter -->
    <app-heart-emitter></app-heart-emitter>
    
    <!-- WhatsApp-like chat layout workspace -->
    <app-messenger (onLogout)="handleLogout()"></app-messenger>
  </ng-container>

  <!-- UNAUTHENTICATED STATE: Login/Register overlaid on WebGL Starfield background -->
  <ng-container *ngIf="!isLoggedIn">
    <!-- Starfield background (WebGL) -->
    <app-galaxy></app-galaxy>
    
    <!-- Glassmorphic Auth Form Container -->
    <div class="auth-card-container">
      <div class="card">
        <div class="card-inner">
          
          <!-- FRONT SIDE (Revealed on Hover) -->
          <div class="card-front auth-card glass">
            <!-- Animated Border Beam Effect -->
            <div class="border-beam">
              <div class="border-beam-inner"></div>
            </div>

            <!-- Title Header -->
            <header class="auth-header">
              <div class="romantic-logo">💖</div>
              <!-- Interactive Particle Text Animation Canvas -->
              <div class="particle-stage">
                <canvas #particleCanvas width="1000" height="300" class="particle-canvas"></canvas>
                
                <!-- Sparkles Core Animation and Gradients -->
                <div class="sparkles-container">
                  <!-- Gradient Accents -->
                  <div class="sparkles-gradient-blur-indigo"></div>
                  <div class="sparkles-gradient-line-indigo"></div>
                  <div class="sparkles-gradient-blur-sky"></div>
                  <div class="sparkles-gradient-line-sky"></div>

                  <!-- Sparkles Core Particles -->
                  <app-sparkles
                    [minSize]="0.4"
                    [maxSize]="1"
                    [particleDensity]="1200"
                    particleColor="#FFFFFF"
                    [speed]="1">
                  </app-sparkles>
                </div>
              </div>

              <p class="subtitle">A Galactic Dream Messenger for Two</p>
            </header>



            <!-- Error & Success Notification Banners -->
            <div class="alert alert-error" *ngIf="errorMessage">
              <span>⚠️</span> {{ errorMessage }}
            </div>
            <div class="alert alert-success" *ngIf="successMessage">
              <span>💖</span> {{ successMessage }}
            </div>

            <!-- 1. LOGIN FORM -->
            <form (ngSubmit)="onLogin()" *ngIf="isLoginMode" class="auth-form">
              <div class="input-group">
                <label for="login-email">Email Address</label>
                <input 
                  type="email" 
                  id="login-email" 
                  name="loginEmail"
                  placeholder="name@email.com" 
                  [(ngModel)]="loginEmail" 
                  required />
              </div>

              <div class="input-group">
                <label for="login-password">Password</label>
                <input 
                  type="password" 
                  id="login-password" 
                  name="loginPassword"
                  placeholder="••••••••" 
                  [(ngModel)]="loginPassword" 
                  required />
              </div>

              <button type="submit" class="btn-53"> 
                <div class="original"> 
                  <span class="grad">Login for love</span> 
                </div> 
                <div class="letters" aria-hidden="true"> 
                  <span class="grad">W</span> 
                  <span class="grad">e</span> 
                  <span class="grad">l</span> 
                  <span class="grad">c</span> 
                  <span class="grad">o</span> 
                  <span class="grad">m</span> 
                  <span class="grad">e</span> 
                  <span class="emoji">💞</span> 
                </div> 
              </button>
            </form>

            <!-- 2. REGISTRATION FORM -->
            <form (ngSubmit)="onRegister()" *ngIf="!isLoginMode" class="auth-form">
              <div class="input-group">
                <label for="reg-name">Your Name</label>
                <input 
                  type="text" 
                  id="reg-name" 
                  name="registerName"
                  placeholder="e.g. Emma" 
                  [(ngModel)]="registerName" 
                  required />
              </div>

              <div class="input-group">
                <label for="reg-email">Email Address</label>
                <input 
                  type="email" 
                  id="reg-email" 
                  name="registerEmail"
                  placeholder="name@email.com" 
                  [(ngModel)]="registerEmail" 
                  required />
              </div>

              <div class="input-group">
                <label for="reg-password">Password</label>
                <input 
                  type="password" 
                  id="reg-password" 
                  name="registerPassword"
                  placeholder="Create a password" 
                  [(ngModel)]="registerPassword" 
                  required />
              </div>

              <button type="submit" class="btn-53">
                <div class="original">
                  <span class="grad">Register</span>
                </div>
                <div class="letters" aria-hidden="true">
                  <span class="grad">I love you</span><span class="emoji">🥀</span>
                </div>
              </button>
            </form>

            <!-- Toggle Auth view -->
            <footer class="auth-footer">
              <p *ngIf="isLoginMode">
                Don't have an account? 
                <a (click)="toggleMode()">Register here</a>
              </p>
              <p *ngIf="!isLoginMode">
                Already registered? 
                <a (click)="toggleMode()">Log in instead</a>
              </p>
            </footer>
          </div>

          <!-- BACK SIDE (Starts on Back Side) -->
          <div class="card-back auth-card glass">
            <!-- Animated Border Beam Effect -->
            <div class="border-beam">
              <div class="border-beam-inner"></div>
            </div>

            <div class="card-back-image-wrapper">
              <img 
                src="assets/radha_krishna_card_back.jpg" 
                alt="Radha Krishna Romantic Quote" 
                class="card-back-img" 
              />
            </div>
          </div>

        </div>
      </div>
    </div>
  </ng-container>

</div>
