<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varshitha — Particle Text</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
  }
  #stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  canvas{
    max-width:100%;
    height:auto;
  }
  .caption{
    color:#8a8a8a;
    font-size:12px;
    text-align:center;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="1000" height="300"></canvas>
</div>

<script>
class Particle {
  constructor(){
    this.pos = {x:0,y:0};
    this.vel = {x:0,y:0};
    this.acc = {x:0,y:0};
    this.target = {x:0,y:0};
    this.closeEnoughTarget = 100;
    this.maxSpeed = 1.0;
    this.maxForce = 0.1;
    this.particleSize = 10;
    this.isKilled = false;
    this.startColor = {r:0,g:0,b:0};
    this.targetColor = {r:0,g:0,b:0};
    this.colorWeight = 0;
    this.colorBlendRate = 0.01;
  }

  move(){
    let proximityMult = 1;
    const distance = Math.hypot(this.pos.x - this.target.x, this.pos.y - this.target.y);
    if (distance < this.closeEnoughTarget) proximityMult = distance / this.closeEnoughTarget;

    const towards = { x: this.target.x - this.pos.x, y: this.target.y - this.pos.y };
    const mag = Math.hypot(towards.x, towards.y);
    if (mag > 0){
      towards.x = (towards.x / mag) * this.maxSpeed * proximityMult;
      towards.y = (towards.y / mag) * this.maxSpeed * proximityMult;
    }

    const steer = { x: towards.x - this.vel.x, y: towards.y - this.vel.y };
    const steerMag = Math.hypot(steer.x, steer.y);
    if (steerMag > 0){
      steer.x = (steer.x / steerMag) * this.maxForce;
      steer.y = (steer.y / steerMag) * this.maxForce;
    }

    this.acc.x += steer.x;
    this.acc.y += steer.y;
    this.vel.x += this.acc.x;
    this.vel.y += this.acc.y;
    this.pos.x += this.vel.x;
    this.pos.y += this.vel.y;
    this.acc.x = 0;
    this.acc.y = 0;
  }

  draw(ctx){
    if (this.colorWeight < 1.0) this.colorWeight = Math.min(this.colorWeight + this.colorBlendRate, 1.0);
    const c = {
      r: Math.round(this.startColor.r + (this.targetColor.r - this.startColor.r) * this.colorWeight),
      g: Math.round(this.startColor.g + (this.targetColor.g - this.startColor.g) * this.colorWeight),
      b: Math.round(this.startColor.b + (this.targetColor.b - this.startColor.b) * this.colorWeight),
    };
    ctx.fillStyle = `rgb(${c.r}, ${c.g}, ${c.b})`;
    ctx.fillRect(this.pos.x, this.pos.y, 3, 3);
  }

  kill(width, height){
    if (!this.isKilled){
      const p = generateRandomPos(width/2, height/2, (width+height)/2);
      this.target.x = p.x;
      this.target.y = p.y;
      this.startColor = {
        r: this.startColor.r + (this.targetColor.r - this.startColor.r) * this.colorWeight,
        g: this.startColor.g + (this.targetColor.g - this.startColor.g) * this.colorWeight,
        b: this.startColor.b + (this.targetColor.b - this.startColor.b) * this.colorWeight,
      };
      this.targetColor = {r:0,g:0,b:0};
      this.colorWeight = 0;
      this.isKilled = true;
    }
  }
}

function generateRandomPos(x, y, mag){
  const randomX = Math.random() * 1000;
  const randomY = Math.random() * 500;
  const dir = { x: randomX - x, y: randomY - y };
  const mag2 = Math.hypot(dir.x, dir.y);
  if (mag2 > 0){
    dir.x = (dir.x / mag2) * mag;
    dir.y = (dir.y / mag2) * mag;
  }
  return { x: x + dir.x, y: y + dir.y };
}

// Finds connected blobs of opaque pixels in the alpha channel.
// Used to locate the small isolated dot above the "i".
function findBlobs(pixels, width, height){
  const visited = new Uint8Array(width * height);
  const blobs = [];
  const alphaAt = (x, y) => pixels[(y * width + x) * 4 + 3];

  for (let y = 0; y < height; y++){
    for (let x = 0; x < width; x++){
      const i = y * width + x;
      if (!visited[i] && alphaAt(x, y) > 0){
        let minX = x, maxX = x, minY = y, maxY = y, count = 0;
        const stack = [[x, y]];
        visited[i] = 1;
        while (stack.length){
          const [cx, cy] = stack.pop();
          count++;
          if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
          const neighbors = [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1],[cx+1,cy+1],[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1]];
          for (const [nx, ny] of neighbors){
            if (nx >= 0 && nx < width && ny >= 0 && ny < height){
              const ni = ny * width + nx;
              if (!visited[ni] && alphaAt(nx, ny) > 0){
                visited[ni] = 1;
                stack.push([nx, ny]);
              }
            }
          }
        }
        blobs.push({ minX, maxX, minY, maxY, count });
      }
    }
  }
  return blobs;
}

function drawHeart(ctx, cx, cy, size, color){
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  const top = size * 0.3;
  ctx.moveTo(cx, cy + top);
  ctx.bezierCurveTo(cx, cy, cx - size/2, cy, cx - size/2, cy + top);
  ctx.bezierCurveTo(cx - size/2, cy + top + size/4, cx, cy + top + size/2, cx, cy + size);
  ctx.bezierCurveTo(cx, cy + top + size/2, cx + size/2, cy + top + size/4, cx + size/2, cy + top);
  ctx.bezierCurveTo(cx + size/2, cy, cx, cy, cx, cy + top);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Original rose illustration — layered petal rings, leaves, and a thorny
// stem — drawn from scratch (not traced from any photo).
function drawPetalRing(ctx, count, len, width, angleOffset, color){
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = 1;
  for (let i = 0; i < count; i++){
    const angle = (angleOffset + (360/count)*i) * Math.PI/180;
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(width*0.6, -len*0.35, width*0.55, -len*0.85, 0, -len);
    ctx.bezierCurveTo(-width*0.55, -len*0.85, -width*0.6, -len*0.35, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

function drawLeaf(ctx, x, y, angleDeg, size, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angleDeg * Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(size*0.52, -size*0.22, size*0.5, -size*0.82, 0, -size);
  ctx.bezierCurveTo(-size*0.5, -size*0.82, -size*0.52, -size*0.22, 0, 0);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -3);
  ctx.lineTo(0, -size + 5);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

// Draw thron
function drawThorn(ctx, x, y, angleDeg){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angleDeg * Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(9,-3);
  ctx.lineTo(0,6);
  ctx.closePath();
  ctx.fillStyle = '#2f6b2f';
  ctx.fill();
  ctx.restore();
}

function drawRose(ctx, cx, cy, scale, rotation, alpha){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  const bloomY = -70;

  // stem
  ctx.beginPath();
  ctx.moveTo(0, bloomY + 44);
  ctx.quadraticCurveTo(12, bloomY + 100, -6, 170);
  ctx.strokeStyle = '#2f6b2f';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.stroke();

  drawThorn(ctx, 6, bloomY + 90, 40);
  drawThorn(ctx, -3, bloomY + 135, -130);

  // leaves
  drawLeaf(ctx, 4, bloomY + 95, -55, 60, '#2e6b32');
  drawLeaf(ctx, -2, bloomY + 145, 60, 50, '#356f38');

  // bloom
  ctx.save();
  ctx.translate(0, bloomY);
  drawPetalRing(ctx, 6, 46, 30, 0,  '#7a0f14');
  drawPetalRing(ctx, 5, 34, 22, 20, '#931a1a');
  drawPetalRing(ctx, 4, 22, 15, 40, '#b32424');
  ctx.beginPath();
  ctx.fillStyle = '#4a0808';
  ctx.ellipse(0, 4, 7, 10, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pixelSteps = 6;
let particles = [];
const mouse = { x:0, y:0, isPressed:false, isRightClick:false };

function setWord(segments, fontSize = 110){
  // segments: array of { text, color }
  const off = document.createElement('canvas');
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext('2d');
  octx.font = `italic bold ${fontSize}px Arial`;
  octx.textAlign = 'left';
  octx.textBaseline = 'middle';

  const fullText = segments.map(s => s.text).join('');
  const totalWidth = octx.measureText(fullText).width;
  let x = canvas.width/2 - totalWidth/2;
  const y = canvas.height/2;

  segments.forEach(seg => {
    octx.fillStyle = seg.color;
    octx.fillText(seg.text, x, y);
    x += octx.measureText(seg.text).width;
  });



  if (fullText.toLowerCase().includes('i')){
    let probeData = octx.getImageData(0, 0, canvas.width, canvas.height);
    const blobs = findBlobs(probeData.data, canvas.width, canvas.height);
    if (blobs.length){
      const dot = blobs.reduce((a, b) => (a.count < b.count ? a : b));
      const dotW = dot.maxX - dot.minX;
      const dotH = dot.maxY - dot.minY;
      const cx = (dot.minX + dot.maxX) / 2;
      const cy = (dot.minY + dot.maxY) / 2;
      const pad = 4;
      octx.clearRect(dot.minX - pad, dot.minY - pad, dotW + pad*2, dotH + pad*2);
      const heartSize = Math.max(dotW, dotH) * 2.6;
      drawHeart(octx, cx, cy - heartSize*0.32, heartSize, 'rgb(139,0,0)');
    }
  }

  const imageData = octx.getImageData(0,0,canvas.width,canvas.height);
  const pixels = imageData.data;

  const coordsIndexes = [];
  for (let i=0; i<pixels.length; i += pixelSteps*4) coordsIndexes.push(i);
  for (let i=coordsIndexes.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [coordsIndexes[i], coordsIndexes[j]] = [coordsIndexes[j], coordsIndexes[i]];
  }

  let particleIndex = 0;
  for (const coordIndex of coordsIndexes){
    const alpha = pixels[coordIndex+3];
    if (alpha > 0){
      const x = (coordIndex/4) % canvas.width;
      const y = Math.floor(coordIndex/4/canvas.width);
      const pixelColor = { r: pixels[coordIndex], g: pixels[coordIndex+1], b: pixels[coordIndex+2] };

      let particle;
      if (particleIndex < particles.length){
        particle = particles[particleIndex];
        particle.isKilled = false;
        particleIndex++;
      } else {
        particle = new Particle();
        const p = generateRandomPos(canvas.width/2, canvas.height/2, (canvas.width+canvas.height)/2);
        particle.pos.x = p.x;
        particle.pos.y = p.y;
        particle.particleSize = Math.random()*6 + 6;
        particle.colorBlendRate = Math.random()*0.0275 + 0.0025;
        particles.push(particle);
      }

      particle.maxSpeed = Math.random() * 3 + 2; // Slower speed
      particle.maxForce = particle.maxSpeed * 0.03; // Slower steering force

      particle.startColor = {
        r: particle.startColor.r + (particle.targetColor.r - particle.startColor.r) * particle.colorWeight,
        g: particle.startColor.g + (particle.targetColor.g - particle.startColor.g) * particle.colorWeight,
        b: particle.startColor.b + (particle.targetColor.b - particle.startColor.b) * particle.colorWeight,
      };
      particle.targetColor = pixelColor;
      particle.colorWeight = 0;
      particle.target.x = x;
      particle.target.y = y;
    }
  }

  for (let i=particleIndex; i<particles.length; i++) particles[i].kill(canvas.width, canvas.height);
}

function animate(){
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for (let i=particles.length-1; i>=0; i--){
    const particle = particles[i];
    particle.move();
    particle.draw(ctx);
    if (particle.isKilled){
      if (particle.pos.x < 0 || particle.pos.x > canvas.width || particle.pos.y < 0 || particle.pos.y > canvas.height){
        particles.splice(i,1);
      }
    }
  }

  if (mouse.isPressed && mouse.isRightClick){
    particles.forEach(p => {
      const d = Math.hypot(p.pos.x - mouse.x, p.pos.y - mouse.y);
      if (d < 50) p.kill(canvas.width, canvas.height);
    });
  }

  requestAnimationFrame(animate);
}

let sequenceTimeouts = [];
function playSequence(){
  sequenceTimeouts.forEach(t => clearTimeout(t));
  sequenceTimeouts = [];

  setWord([
    { text: 'Love ', color: '#ff3b5c' },
    { text: 'You', color: '#e63946' },
  ], 110);

  const t1 = setTimeout(() => {
    setWord([
      { text: 'Varshitha', color: '#ffffff' },
    ], 150);
  }, 4500);

  sequenceTimeouts.push(t1);
}

playSequence();
animate();

canvas.addEventListener('mousedown', e => {
  mouse.isPressed = true;
  mouse.isRightClick = e.button === 2;
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mouseup', () => { mouse.isPressed = false; mouse.isRightClick = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
